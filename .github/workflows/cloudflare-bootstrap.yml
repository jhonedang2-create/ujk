name: Cloudflare migration verification
on:
  push:
    branches: [work/cloudflare-20260929]
permissions:
  contents: write
concurrency:
  group: cloudflare-migration
  cancel-in-progress: true
jobs:
  verify:
    if: github.ref == 'refs/heads/work/cloudflare-20260929'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: ujk
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:ci-disposable-only@127.0.0.1:5432/ujk
      DIRECT_URL: postgresql://postgres:ci-disposable-only@127.0.0.1:5432/ujk
      AUTH_URL: http://127.0.0.1:8787
      AUTH_TRUST_HOST: 'true'
      NEXT_PUBLIC_SITE_URL: https://woojeonggim.com
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/cloudflare-20260929
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure migration and resolve pinned dependencies
        run: |
          node scripts/configure-cloudflare-once.mjs
          npm install --save-exact @opennextjs/cloudflare@1 @prisma/adapter-pg@6.19.1 pg@8
          npm install --save-dev --save-exact wrangler@4
          npm ls next @prisma/client @prisma/adapter-pg @opennextjs/cloudflare wrangler pg
      - name: Initialize disposable test database only
        run: |
          echo "AUTH_SECRET=$(openssl rand -base64 48 | tr -d '\n')" >> "$GITHUB_ENV"
          echo "ADMIN_USERNAME=cf-smoke-admin" >> "$GITHUB_ENV"
          echo "ADMIN_PASSWORD=CiOnly-$(openssl rand -hex 20)-Aa1!" >> "$GITHUB_ENV"
          npx prisma db push --schema prisma/postgresql/schema.prisma --skip-generate
      - name: Seed disposable test data
        run: npm run db:seed:postgres
      - name: Build Next.js and Cloudflare Worker
        run: npm run build:cloudflare
      - name: Validate Worker bundle without deployment
        run: npx wrangler deploy --dry-run --outdir /tmp/ujk-worker-dry-run
      - name: Run Workers runtime smoke tests
        run: npm run test:cloudflare
      - name: Record generated config and lockfile after successful tests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json next.config.mjs .gitignore src/app/sitemap.ts
          if ! git diff --cached --quiet; then
            git commit -m 'build: lock tested Cloudflare dependencies and generated configuration'
            git push origin HEAD:work/cloudflare-20260929
          fi
      - name: Logs on failure
        if: failure()
        run: |
          test ! -f cloudflare-smoke.log || tail -n 160 cloudflare-smoke.log
          find src -type f | sort
          grep -R -n -E 'node:fs|from .fs|runtime.*edge|generateStaticParams' src || true
