name: Message delivery policy
on:
  pull_request:
    paths:
      - 'src/lib/messaging/**'
      - 'src/actions/message-delivery.ts'
      - 'src/app/admin/messages/**'
      - 'tests/message-delivery-policy.test.ts'
      - '.github/workflows/message-delivery-tests.yml'
  push:
    branches: [main]
    paths:
      - 'src/lib/messaging/**'
      - 'tests/message-delivery-policy.test.ts'
permissions:
  contents: read
jobs:
  message-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          DATABASE_URL: file:./ci.db
      - name: No-network message policy tests (no messages or payments)
        run: node --import tsx --test tests/message-delivery-policy.test.ts
